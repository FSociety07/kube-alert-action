apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-alert-action
rules:
  - apiGroups:
      - sawnt.xyz
    resources:
      - alertevents
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - sawnt.xyz
    resources:
      - alertevents/status
    verbs:
      - get
      - update
      - patch

  - apiGroups:
      - sawnt.xyz
    resources:
      - actionmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-alert-action
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-alert-action
subjects:
  - kind: ServiceAccount
    name: kube-alert-action
    namespace: kube-alert-action
