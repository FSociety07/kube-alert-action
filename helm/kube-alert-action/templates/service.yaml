apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.service.annotations }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type}}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: webhook
      port: {{ .Values.service.port}}
      targetPort: 8000
      protocol: TCP
