apiVersion: v1
kind: Namespace
metadata:
  name: kube-alert-action
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-alert-action
  namespace: kube-alert-action
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-alert-action
rules:
  - apiGroups:
      - sawnt.xyz
    resources:
      - alertevents
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - sawnt.xyz
    resources:
      - alertevents/status
    verbs:
      - get
      - update
      - patch

  - apiGroups:
      - sawnt.xyz
    resources:
      - actionmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-alert-action
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-alert-action
subjects:
  - kind: ServiceAccount
    name: kube-alert-action
    namespace: kube-alert-action

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-alert-action
  namespace: kube-alert-action
  labels:
    app: kube-alert-action
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-alert-action
  template:
    metadata:
      labels:
        app: kube-alert-action
    spec:
      serviceAccountName: kube-alert-action
      containers:
        - name: kube-alert-action
          image: sawn37/kube-alert-action:beta
          imagePullPolicy: IfNotPresent
          ports:
            - name: webhook
              containerPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: kube-alert-action
  namespace: kube-alert-action
spec:
  type: LoadBalancer
  selector:
    app: kube-alert-action
  ports:
    - name: webhook
      port: 8000
      targetPort: 8000
      protocol: TCP